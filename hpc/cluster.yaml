# Overrides for a VM or cluster where the conda env is already active (merged over config/default.yaml).
# project_dir and output.work_dir are passed by the run scripts with --set.
solver:
  procs_per_case: 1
  # The job script already activates the conda env, so nothing to do here.
  activate: "true"
  conv_poll_seconds: 30
  pin_cores: true          # one case per physical core, memory on that core's socket
  timeout_hours: 12        # many cases share each node's memory bandwidth, so cases run slower than alone
