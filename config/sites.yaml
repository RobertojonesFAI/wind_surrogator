# Targeted sites for the global dataset: flying sites, places with well-known terrain
# winds, validation campaigns and the original Idaho regions.
#
# Coordinates are approximate (a few km); cases are spread uniformly over a disc of
# radius_km around each point, so the exact centre does not matter.
#   weight   relative share of the site cases (default 1)
#   split    train (default) | val | test. Val/test sites are held out completely: no
#            global case is placed within radius_km + split buffer of them.
#   kind     flying | wind | benchmark | mountain | home (only for bookkeeping)
defaults:
  radius_km: 20
  weight: 1.0
  split: train

